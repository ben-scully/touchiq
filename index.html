<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Touch Rugby Playbook</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --ink: #192b25;
      --muted: #66766d;
      --paper: #f4f3ec;
      --line: #d8ddd3;
      --grass: #4b865b;
      --grass-dark: #3e744e;
      --coral: #f17b61;
      --blue: #57b7c0;
      --gold: #f3ce68;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
    }
    main { width: min(1120px, calc(100% - 48px)); margin: 0 auto; padding: 36px 0 44px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 24px; }
    .eyebrow { margin: 0 0 7px; color: #538160; font-size: 11px; font-weight: 800; letter-spacing: 1.6px; text-transform: uppercase; }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(28px, 5vw, 42px); font-weight: 500; line-height: 1.05; }
    .subhead { margin: 9px 0 0; color: var(--muted); font-size: 14px; }
    .share-button, .build-button, .transport button {
      min-height: 40px; border: 0; border-radius: 4px; cursor: pointer; font: inherit; font-size: 13px; font-weight: 750;
    }
    .share-button { display: inline-flex; align-items: center; gap: 8px; padding: 0 14px; background: var(--ink); color: white; white-space: nowrap; }
    .share-button:hover { background: #30483d; }
    .workspace { display: grid; grid-template-columns: minmax(250px, 330px) minmax(0, 1fr); align-items: start; gap: 28px; }
    .editor-panel { padding: 18px 0 0; border-top: 1px solid var(--line); }
    .panel-heading { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
    .panel-heading h2 { margin: 0; font-size: 14px; font-weight: 800; }
    .syntax-note { color: var(--muted); font-size: 11px; }
    textarea {
      display: block; width: 100%; min-height: 286px; resize: vertical; padding: 14px;
      border: 1px solid #ccd4c9; border-radius: 4px; outline: none; background: #fffefa;
      color: #253b30; font: 13px/1.8 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    textarea:focus { border-color: #548463; box-shadow: 0 0 0 2px #54846322; }
    .build-row { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
    .build-button { padding: 0 16px; background: #dce9d9; color: #294c35; }
    .build-button:hover { background: #cfe0cb; }
    #status { min-height: 17px; color: var(--muted); font-size: 12px; }
    #status[data-error="true"] { color: #b44835; }
    .stage { min-width: 0; }
    .field-wrap { padding: 10px; border: 1px solid #dce0d6; border-radius: 6px; background: #fffefa; }
    #field {
      position: relative; width: 100%; aspect-ratio: 10 / 7; overflow: hidden;
      border: 2px solid #f3f0dc; border-radius: 3px;
      background: repeating-linear-gradient(0deg, transparent 0 48px, #ffffff0d 49px 50px), var(--grass);
      box-shadow: inset 0 0 0 1px #285d3855;
    }
    .field-line { position: absolute; z-index: 0; pointer-events: none; }
    .touch-line { inset: 0 auto 0 0; width: 1px; border-left: 1px solid #e8f0dfb3; }
    .touch-line.right { left: auto; right: 0; }
    .halfway-line { inset: 0 auto 0 50%; border-left: 1px solid #e8f0dfb3; }
    .gain-line { inset: 0 auto 0 30%; border-left: 1px dashed #f3ce68c9; }
    .center-mark { position: absolute; top: 50%; left: 50%; width: 64px; aspect-ratio: 1; border: 1px solid #e8f0dfb3; border-radius: 50%; transform: translate(-50%, -50%); }
    .marker { position: absolute; z-index: 1; left: 0; top: 0; display: flex; align-items: center; justify-content: center; }
    .player { width: 34px; height: 34px; border: 2px solid #fff9e8; border-radius: 50%; color: #173328; font-size: 10px; font-weight: 900; box-shadow: 0 2px 5px #1835234a; }
    #M1, #L1 { background: var(--coral); }
    #M2 { background: var(--blue); }
    #ball { width: 15px; height: 10px; border: 1px solid #544622; border-radius: 60% 45% 60% 45%; background: var(--gold); box-shadow: 0 1px 4px #18352366; }
    .legend { display: flex; flex-wrap: wrap; gap: 16px; padding: 11px 3px 1px; color: var(--muted); font-size: 11px; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--coral); }
    .dot.defence { background: var(--blue); }
    .dot.ball-dot { width: 12px; height: 8px; border-radius: 50%; background: var(--gold); }
    .playback { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
    .transport { display: flex; align-items: center; gap: 8px; }
    .transport button { padding: 0 13px; background: #e5e8df; color: var(--ink); }
    .transport button:hover { background: #d8ded3; }
    .transport .play-button { background: var(--coral); color: #fff; }
    #time-readout { margin-left: auto; color: var(--muted); font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
    #progress { display: block; width: 100%; height: 20px; margin: 11px 0 0; accent-color: #528160; cursor: pointer; }
    @media (max-width: 760px) {
      main { width: min(560px, calc(100% - 32px)); padding-top: 24px; }
      header { align-items: start; }
      .workspace { grid-template-columns: 1fr; gap: 22px; }
      textarea { min-height: 190px; }
    }
    @media (max-width: 440px) {
      header { flex-direction: column; gap: 14px; }
      .share-button { min-height: 36px; }
      .field-wrap { padding: 6px; }
      .player { width: 28px; height: 28px; font-size: 9px; }
      .transport { gap: 6px; }
      .transport button { padding: 0 9px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">Touch rugby · playbook</p>
        <h1>Draw the next move.</h1>
        <p class="subhead">Build a sequence, then run it on the pitch.</p>
      </div>
      <button class="share-button" id="share" type="button" aria-label="Copy share link">↗ <span>Copy Share Link</span></button>
    </header>

    <div class="workspace">
      <section class="editor-panel" aria-labelledby="dsl-heading">
        <div class="panel-heading">
          <h2 id="dsl-heading">Play DSL</h2>
          <span class="syntax-note">one move per line</span>
        </div>
        <textarea id="dsl" spellcheck="false" aria-label="Play DSL"></textarea>
        <div class="build-row">
          <button class="build-button" id="build" type="button">Build play</button>
          <span id="status" role="status" aria-live="polite"></span>
        </div>
      </section>

      <section class="stage" aria-label="Animated rugby pitch">
        <div class="field-wrap">
          <div id="field">
            <div class="field-line touch-line"></div>
            <div class="field-line touch-line right"></div>
            <div class="field-line halfway-line"></div>
            <div class="field-line gain-line"></div>
            <div class="center-mark"></div>
            <div id="M1" class="marker player">M1</div>
            <div id="M2" class="marker player">M2</div>
            <div id="L1" class="marker player">L1</div>
            <div id="ball" class="marker" aria-label="Ball"></div>
          </div>
          <div class="legend" aria-label="Pitch legend">
            <span><i class="dot"></i>Attack</span>
            <span><i class="dot defence"></i>Defence</span>
            <span><i class="dot ball-dot"></i>Ball</span>
            <span><i class="field-line gain-line" style="position:relative;inset:auto;height:12px"></i>Gain line</span>
          </div>
        </div>
        <div class="playback" aria-label="Playback controls">
          <div class="transport">
            <button class="play-button" id="play" type="button">Play</button>
            <button id="pause" type="button">Pause</button>
            <button id="restart" type="button">Restart</button>
            <span id="time-readout">0.0 / 0.0s</span>
          </div>
          <input id="progress" type="range" min="0" max="1" step="0.001" value="0" aria-label="Play progress">
        </div>
      </section>
    </div>
  </main>

  <script>
    const defaultDSL = `M1: RUN(64,172 -> 180,172)
M2: RUN(390,90 -> 300,132)
L1: RUN(64,260 -> 188,218)
BALL: MOVE(86,182 -> 194,176)
M1: RUN(180,172 -> 292,130)
BALL: PASS(194,176 -> 302,138)`;
    const actorIds = ["M1", "M2", "L1", "BALL"];
    const movementPattern = /\b(?:RUN|MOVE|CARRY|PASS|KICK)\s*\(\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*->\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*\)/gi;
    const editor = document.querySelector("#dsl");
    const field = document.querySelector("#field");
    const progress = document.querySelector("#progress");
    const timeReadout = document.querySelector("#time-readout");
    const status = document.querySelector("#status");
    let timeline = gsap.timeline({ paused: true });

    function getInitialDSL() {
      const hash = window.location.hash;
      if (!hash) return defaultDSL;
      const value = hash.startsWith("#play=") ? hash.slice(6) : hash.slice(1);
      try { return decodeURIComponent(value); } catch { return defaultDSL; }
    }

    function parseDSL(text) {
      const moves = Object.fromEntries(actorIds.map(id => [id, []]));
      const lines = text.split(/\r?\n/);
      const errors = [];

      lines.forEach((line, index) => {
        const content = line.trim();
        if (!content || content.startsWith("//")) return;
        const match = content.match(/^(M1|M2|L1|BALL)\s*:\s*(.+)$/i);
        if (!match) {
          errors.push(`Line ${index + 1}: expected M1, M2, L1 or BALL.`);
          return;
        }

        const actor = match[1].toUpperCase();
        const commands = [...match[2].matchAll(movementPattern)];
        if (!commands.length) {
          errors.push(`Line ${index + 1}: add a RUN or MOVE command with coordinates.`);
          return;
        }
        commands.forEach(command => {
          const [startX, startY, targetX, targetY] = command.slice(1).map(Number);
          moves[actor].push({ startX, startY, targetX, targetY });
        });
      });

      if (!actorIds.some(id => moves[id].length)) errors.push("Add at least one movement command.");
      return { moves, errors };
    }

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.dataset.error = String(isError);
    }

    function updateReadout() {
      const duration = timeline.duration();
      progress.value = duration ? timeline.progress().toFixed(3) : "0";
      timeReadout.textContent = `${timeline.time().toFixed(1)} / ${duration.toFixed(1)}s`;
    }

    function buildPlay() {
      const { moves, errors } = parseDSL(editor.value);
      if (errors.length) {
        setStatus(errors[0], true);
        return;
      }

      timeline.pause().kill();
      const scaleX = (field.clientWidth - 4) / 500;
      const scaleY = (field.clientHeight - 4) / 350;
      timeline = gsap.timeline({ paused: true, onUpdate: updateReadout });

      actorIds.forEach(actor => {
        const actorMoves = moves[actor];
        const element = document.getElementById(actor === "BALL" ? "ball" : actor);
        gsap.set(element, { x: 0, y: 0 });
        if (!actorMoves.length) return;

        const sequence = gsap.timeline();
        const firstMove = actorMoves[0];
        gsap.set(element, { x: firstMove.startX * scaleX, y: firstMove.startY * scaleY });
        actorMoves.forEach(move => {
          sequence.to(element, {
            x: move.targetX * scaleX,
            y: move.targetY * scaleY,
            duration: 1.25,
            ease: "power1.inOut"
          });
        });
        timeline.add(sequence, 0);
      });

      timeline.pause(0);
      updateReadout();
      setStatus(`${actorIds.filter(id => moves[id].length).length} actors · ${timeline.duration().toFixed(1)}s`);
    }

    editor.value = getInitialDSL();
    document.querySelector("#build").addEventListener("click", buildPlay);
    document.querySelector("#play").addEventListener("click", () => timeline.play());
    document.querySelector("#pause").addEventListener("click", () => timeline.pause());
    document.querySelector("#restart").addEventListener("click", () => timeline.restart());
    progress.addEventListener("input", () => {
      timeline.pause();
      timeline.progress(Number(progress.value));
      updateReadout();
    });
    document.querySelector("#share").addEventListener("click", async event => {
      const label = event.currentTarget.querySelector("span");
      const link = `${window.location.origin}${window.location.pathname}#play=${encodeURIComponent(editor.value)}`;
      try {
        await navigator.clipboard.writeText(link);
      } catch {
        const temporary = document.createElement("textarea");
        temporary.value = link;
        temporary.style.position = "fixed";
        temporary.style.opacity = "0";
        document.body.append(temporary);
        temporary.select();
        document.execCommand("copy");
        temporary.remove();
      }
      label.textContent = "Link Copied";
      window.setTimeout(() => { label.textContent = "Copy Share Link"; }, 1600);
    });

    buildPlay();
    timeline.play();
  </script>
</body>
</html>
